<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des étudiants</title>
</head>
<body>
<h1>Liste des étudiants</h1>
<a href="/students/add">Ajouter un étudiant</a>
<table border="1">
    <thead>
        <tr>
            <th>ID</th><th>Nom</th><th>Prénom</th><th>Matricule</th><th>Email</th><th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.nom}"></td>
            <td th:text="${s.prenom}"></td>
            <td th:text="${s.matricule}"></td>
            <td th:text="${s.email}"></td>
            <td>
                <a th:href="@{/students/edit/{id}(id=${s.id})}">Modifier</a> |
                <a th:href="@{/students/delete/{id}(id=${s.id})}">Supprimer</a>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
